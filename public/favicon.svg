<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="educoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123D78"/>
      <stop offset="100%" stop-color="#092144"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F12D3A"/>
      <stop offset="100%" stop-color="#C81E29"/>
    </linearGradient>
  </defs>

  <!-- Rounded Square Background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#educoGrad)"/>

  <!-- Graduation Cap Diamond (Top) -->
  <polygon points="50,20 86,39 50,58 14,39" fill="#FFFFFF"/>
  <polygon points="50,23 82,39 50,55 18,39" fill="url(#redGrad)"/>

  <!-- Cap Skull Base -->
  <path d="M28 47 L28 65 C28 73 72 73 72 65 L72 47 C65 52 58 55 50 55 C42 55 35 52 28 47 Z" fill="#FFFFFF"/>

  <!-- Tassel on left -->
  <line x1="16" y1="43" x2="12" y2="55" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="10" y="55" width="4" height="15" rx="1" fill="#FFFFFF"/>
  <circle cx="16" cy="43" r="2.5" fill="#FFFFFF"/>

  <!-- EDUCO Label Badge at bottom -->
  <rect x="22" y="77" width="56" height="15" rx="5" fill="#FFFFFF"/>
  <text x="50" y="88.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10" font-weight="900" fill="#123D78" text-anchor="middle" letter-spacing="1">EDUCO</text>
</svg>
